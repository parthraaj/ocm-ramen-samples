---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
  labels:
    role: writer
spec:
  replicas: 1
  selector:
    matchLabels:
      workload: busybox
  template:
    metadata:
      labels:
        workload: busybox
        role: writer
    spec:
      containers:
        - name: writer
          image: quay.io/nirsof/busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              emit() {
                  echo "$(date) $1" >> /data/ramen.log
                  sync
              }
              trap "emit STOP; exit" TERM
              emit START
              while true; do
                  sleep 10 & wait
                  emit UPDATE
              done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: busybox-pvc
